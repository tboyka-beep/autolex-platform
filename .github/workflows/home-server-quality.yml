name: Autolex Home Server Quality

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autolex-home-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full quality gate on home-server
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, autolex]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify dedicated Autolex runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "home-server" || {
            echo "This job must run on the home-server host."
            exit 1
          }
          for command in php node zip curl jq; do
            command -v "$command" >/dev/null || {
              echo "Missing required home-server command: $command"
              exit 1
            }
          done
          php -r 'if (PHP_VERSION_ID < 80300) { fwrite(STDERR, "PHP 8.3 or newer is required.\n"); exit(1); }'
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          php --version | head -n 1
          node --version

      - name: Validate every plugin PHP file
        run: find plugin/autolex-platform -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run core data smoke tests
        run: |
          php tests/eea-importer-smoke.php
          php tests/eea-sync-smoke.php
          php tests/engine-catalog-smoke.php
          php tests/eurostat-smoke.php
          php tests/eafo-smoke.php

      - name: Run portal and Safety Gate smoke tests
        run: |
          test ! -f tests/portal-smoke.php || php tests/portal-smoke.php
          test ! -f tests/safety-gate-smoke.php || php tests/safety-gate-smoke.php
          test ! -f plugin/autolex-platform/assets/js/autolex-portal-3.js || node --check plugin/autolex-platform/assets/js/autolex-portal-3.js

      - name: Run operations center smoke test when present
        run: test ! -f tests/operations-center-smoke.php || php tests/operations-center-smoke.php

      - name: Build deployable plugin ZIP
        run: |
          rm -f autolex-platform.zip
          cd plugin
          zip -rq ../autolex-platform.zip autolex-platform \
            -x '*/.git/*' \
            -x '*/node_modules/*' \
            -x '*/vendor/*' \
            -x '*/.DS_Store'

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: autolex-home-server-${{ github.sha }}
          path: autolex-platform.zip
          if-no-files-found: error
          retention-days: 14
