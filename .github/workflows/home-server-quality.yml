name: Autolex Home Server Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autolex-home-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full quality gate on home-server
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify dedicated Autolex runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "home-server" || {
            echo "This job must run on the home-server host."
            exit 1
          }
          for command in php node zip curl jq; do
            command -v "$command" >/dev/null || {
              echo "Missing required home-server command: $command"
              exit 1
            }
          done
          php -r 'if (PHP_VERSION_ID < 80300) { fwrite(STDERR, "PHP 8.3 or newer is required.\n"); exit(1); } if (!extension_loaded("simplexml")) { fwrite(STDERR, "PHP SimpleXML is required.\n"); exit(1); }'
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "Host: $(hostname)"
          php --version | head -n 1
          node --version

      - name: Validate every plugin PHP file
        run: find plugin/autolex-platform -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run core data smoke tests
        run: |
          php tests/eea-importer-smoke.php
          php tests/eea-sync-smoke.php
          php tests/engine-catalog-smoke.php
          php tests/eurostat-smoke.php
          php tests/eafo-smoke.php
          php tests/source-provenance-smoke.php
          php tests/source-provenance-write-smoke.php
          php tests/provenance-batch-importer-smoke.php
          php tests/official-source-adapter-smoke.php
          php tests/safety-gate-source-adapter-smoke.php
          php tests/eea-source-adapter-smoke.php
          php tests/eurostat-source-adapter-smoke.php
          php tests/eafo-source-adapter-smoke.php
          php tests/source-cards-smoke.php
          php tests/source-integration-smoke.php
          php tests/provenance-coverage-smoke.php
          php tests/theme-data-bridge-smoke.php

      - name: Run portal and deterministic Safety Gate smoke tests
        run: |
          php tests/portal-smoke.php
          php tests/catalog-filter-smoke.php
          php tests/public-presentation-smoke.php
          php tests/portal-design-smoke.php
          php tests/portal-shell-42-smoke.php
          php tests/catalog-design-42-smoke.php
          php tests/taxonomy-design-42-smoke.php
          php tests/vehicle-detail-smoke.php
          php tests/vehicle-detail-design-42-smoke.php
          php tests/compare-design-42-smoke.php
          php tests/safety-gate-smoke.php
          php tests/safety-gate-inbox-smoke.php
          node --check plugin/autolex-platform/assets/js/autolex-portal-3.js
          node --check plugin/autolex-platform/assets/js/autolex-maintenance-evidence.js
          node --check plugin/autolex-platform/assets/js/autolex-public-presentation.js

      - name: Confirm live Safety Gate ownership
        run: |
          echo 'The fail-closed official Safety Gate XML check is enforced by Validate Autolex Portal 3.'
          echo 'It is intentionally not duplicated on the home-server PHP/OpenSSL stack.'

      - name: Run operations center smoke test
        run: php tests/operations-center-smoke.php

      - name: Build deployable plugin ZIP
        run: |
          rm -f autolex-platform.zip
          cd plugin
          zip -rq ../autolex-platform.zip autolex-platform \
            -x '*/.git/*' \
            -x '*/node_modules/*' \
            -x '*/vendor/*' \
            -x '*/.DS_Store'

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: autolex-home-server-${{ github.sha }}
          path: autolex-platform.zip
          if-no-files-found: error
          retention-days: 14
