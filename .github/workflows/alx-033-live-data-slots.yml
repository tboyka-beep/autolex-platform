name: ALX-033 Live Data Slots

on:
  push:
    branches:
      - agent/alx-033-live-data-slots
    paths:
      - 'theme/autolex-theme/**'
      - 'plugin/autolex-platform/autolex-platform.php'
      - 'plugin/autolex-platform/includes/class-autolex-theme-data-bridge.php'
      - 'plugin/autolex-platform/assets/css/autolex-theme-data-bridge.css'
      - 'tests/autolex-theme-*-contract.sh'
      - 'tests/theme-data-bridge-smoke.php'
      - 'docs/ALX-033-LIVE-DATA-SLOTS.md'
      - '.github/workflows/alx-033-live-data-slots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alx-033-live-data-slots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-contract:
    name: Validate live data slots on GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Lint public theme and bridge PHP
        run: |
          find theme/autolex-theme -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l plugin/autolex-platform/autolex-platform.php
          php -l plugin/autolex-platform/includes/class-autolex-theme-data-bridge.php
      - name: Run complete theme contract suite
        run: |
          set -euo pipefail
          for contract in tests/autolex-theme-*-contract.sh; do
            echo "Running ${contract}"
            bash "$contract"
          done
      - name: Prove plugin-owned theme data
        run: php tests/theme-data-bridge-smoke.php
      - name: Validate theme JavaScript
        run: find theme/autolex-theme/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  home-server-contract:
    name: Validate live data slots on home-server
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify dedicated runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "home-server" || {
            echo 'This job must run on the home-server host.' >&2
            exit 1
          }
          for command in php node; do
            command -v "$command" >/dev/null || {
              echo "Missing required command: $command" >&2
              exit 1
            }
          done
          php -r 'if (PHP_VERSION_ID < 80300) { fwrite(STDERR, "PHP 8.3 or newer is required.\n"); exit(1); }'
      - name: Lint public theme and bridge PHP
        run: |
          find theme/autolex-theme -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l plugin/autolex-platform/autolex-platform.php
          php -l plugin/autolex-platform/includes/class-autolex-theme-data-bridge.php
      - name: Run complete theme contract suite
        run: |
          set -euo pipefail
          for contract in tests/autolex-theme-*-contract.sh; do
            echo "Running ${contract}"
            bash "$contract"
          done
      - name: Prove plugin-owned theme data
        run: php tests/theme-data-bridge-smoke.php
      - name: Validate theme JavaScript
        run: find theme/autolex-theme/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
