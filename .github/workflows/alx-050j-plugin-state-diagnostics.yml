name: ALX-050J Plugin State Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alx-050j-plugin-state-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect-plugin-state:
    name: Inspect production plugin directories from home-server
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read-only cPanel plugin state
        env:
          CPANEL_API_HOST: ${{ secrets.CPANEL_API_HOST }}
          CPANEL_API_USER: ${{ secrets.CPANEL_API_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PLUGIN_DIR: ${{ secrets.CPANEL_PLUGIN_DIR }}
          FAILED_RELEASE_SHA: bd7508031eae13a5c757f5ca56a10d11e44486e2
        run: |
          set -euo pipefail
          test "$(hostname)" = 'home-server'
          for name in CPANEL_API_HOST CPANEL_API_USER CPANEL_API_TOKEN CPANEL_PLUGIN_DIR; do
            test -n "${!name:-}" || { echo "missing ${name}" >&2; exit 1; }
          done
          plugin_dir="${CPANEL_PLUGIN_DIR%/}"
          plugins_dir="${plugin_dir%/autolex-platform}"
          release_token="$(printf '%s' "$FAILED_RELEASE_SHA" | tr -cd 'A-Za-z0-9' | cut -c1-16)"
          rollback_dir="${plugins_dir}/autolex-platform.rollback-${release_token}"
          failed_dir="${plugins_dir}/autolex-platform.failed-${release_token}"
          auth="Authorization: cpanel ${CPANEL_API_USER}:${CPANEL_API_TOKEN}"

          list_dir() {
            local dir="$1" tmp code
            tmp="$(mktemp)"
            code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 \
              --header "$auth" --get --output "$tmp" --write-out '%{http_code}' \
              --data-urlencode "dir=${dir}" --data-urlencode 'show_hidden=1' \
              "https://${CPANEL_API_HOST}:2083/execute/Fileman/list_files" || true)"
            echo "PLUGIN_STATE_UAPI_HTTP: dir=${dir##*/} code=${code:-transport_error}" >&2
            if [[ "$code" == 200 ]] && jq -e '.result.status == 1' "$tmp" >/dev/null 2>&1; then
              jq -c '{ok:true,items:[.result.data[]? | {name:(.name // ""),type:(.type // ""),size:(.size // 0)}]}' "$tmp"
              rm -f "$tmp"
              return 0
            fi

            code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 \
              --header "$auth" --get --output "$tmp" --write-out '%{http_code}' \
              --data-urlencode "cpanel_jsonapi_user=${CPANEL_API_USER}" \
              --data-urlencode 'cpanel_jsonapi_apiversion=2' \
              --data-urlencode 'cpanel_jsonapi_module=Fileman' \
              --data-urlencode 'cpanel_jsonapi_func=listfiles' \
              --data-urlencode "dir=${dir}" --data-urlencode 'showdotfiles=1' \
              "https://${CPANEL_API_HOST}:2083/json-api/cpanel" || true)"
            echo "PLUGIN_STATE_API2_HTTP: dir=${dir##*/} code=${code:-transport_error}" >&2
            if [[ "$code" == 200 ]] && jq -e '.cpanelresult.event.result == 1' "$tmp" >/dev/null 2>&1; then
              jq -c '{ok:true,items:[.cpanelresult.data[]? | {name:(.file // .name // ""),type:(.type // .mimetype // ""),size:(.size // 0)}]}' "$tmp"
              rm -f "$tmp"
              return 0
            fi
            printf '{"ok":false,"items":[]}\n'
            rm -f "$tmp"
          }

          parent_json="$(list_dir "$plugins_dir")"
          jq -e '.ok == true' <<<"$parent_json" >/dev/null || { echo 'PLUGIN_STATE_FAIL: plugin parent unreadable' >&2; exit 1; }
          jq -r '.items[] | select(.name | startswith("autolex-platform")) | "PLUGIN_STATE_PARENT: name=\(.name) type=\(.type) size=\(.size)"' <<<"$parent_json"

          inspect_dir() {
            local label="$1" dir="$2" data
            data="$(list_dir "$dir")"
            if ! jq -e '.ok == true' <<<"$data" >/dev/null; then
              echo "PLUGIN_STATE_MISSING_OR_UNREADABLE: ${label}"
              return 0
            fi
            echo "PLUGIN_STATE_PRESENT: ${label}"
            jq -r --arg label "$label" '.items[] | select(.name == "autolex-platform.php" or .name == "includes" or .name == "assets") | "PLUGIN_STATE_ITEM: \($label) name=\(.name) type=\(.type) size=\(.size)"' <<<"$data"
          }

          inspect_dir active "$plugin_dir"
          inspect_dir rollback "$rollback_dir"
          inspect_dir failed "$failed_dir"
          echo "PLUGIN_STATE_DIAGNOSTICS_OK"
