name: ALX-050N Locate Extracted Staging

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alx-050n-locate-extracted-staging.yml'

permissions:
  contents: read

jobs:
  locate-staging:
    name: Locate exact extracted staging tree from home-server
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read-only recursive cPanel search
        env:
          CPANEL_API_HOST: ${{ secrets.CPANEL_API_HOST }}
          CPANEL_API_USER: ${{ secrets.CPANEL_API_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          STAGING_NAME: autolex-platform.release-adbbc5c86fb92aa7
        run: |
          set -euo pipefail
          test "$(hostname)" = 'home-server'
          for name in CPANEL_API_HOST CPANEL_API_USER CPANEL_API_TOKEN STAGING_NAME; do
            test -n "${!name:-}" || { echo "missing ${name}" >&2; exit 1; }
          done
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 120 \
            --header "Authorization: cpanel ${CPANEL_API_USER}:${CPANEL_API_TOKEN}" \
            --get --output "$tmp" --write-out '%{http_code}' \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_API_USER}" \
            --data-urlencode 'cpanel_jsonapi_apiversion=2' \
            --data-urlencode 'cpanel_jsonapi_module=Fileman' \
            --data-urlencode 'cpanel_jsonapi_func=search' \
            --data-urlencode 'recursive=1' \
            --data-urlencode 'attributes=type|size|mtime' \
            --data-urlencode "regex=${STAGING_NAME}" \
            "https://${CPANEL_API_HOST}:2083/json-api/cpanel")"
          echo "STAGING_SEARCH_HTTP: ${code}"
          test "$code" = 200
          jq -e '.cpanelresult.event.result == 1' "$tmp" >/dev/null
          count="$(jq '[.cpanelresult.data[]?] | length' "$tmp")"
          echo "STAGING_SEARCH_COUNT: ${count}"
          jq -r '.cpanelresult.data[]? | "STAGING_SEARCH_MATCH: file=\(.file // "") type=\(.type // "") size=\(.size // 0) mtime=\(.mtime // 0)"' "$tmp"
          echo 'STAGING_SEARCH_DIAGNOSTICS_OK'
