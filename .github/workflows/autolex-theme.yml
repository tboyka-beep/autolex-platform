name: Autolex Theme Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'theme/autolex-theme/**'
      - 'tests/autolex-theme-contract.sh'
      - '.github/workflows/autolex-theme.yml'
  push:
    branches: [main]
    paths:
      - 'theme/autolex-theme/**'
      - 'tests/autolex-theme-contract.sh'
      - '.github/workflows/autolex-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate light theme foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bash tests/autolex-theme-contract.sh
