name: Autolex Theme Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'theme/autolex-theme/**'
      - 'plugin/autolex-platform/includes/class-autolex-theme-data-bridge.php'
      - 'docs/AUTOLEX-THEME-MIGRATION-AUDIT.md'
      - 'docs/ALX-035-REAL-MEDIA-POLISH.md'
      - 'tests/autolex-theme-contract.sh'
      - 'tests/autolex-theme-hierarchy-contract.sh'
      - 'tests/autolex-theme-vehicle-detail-contract.sh'
      - 'tests/autolex-theme-metadata-contract.sh'
      - 'tests/autolex-theme-assets-contract.sh'
      - 'tests/autolex-theme-images-contract.sh'
      - 'tests/autolex-theme-search-contract.sh'
      - 'tests/autolex-theme-mobile-drawer-contract.sh'
      - 'tests/autolex-theme-home-reference-contract.sh'
      - 'tests/autolex-theme-reference-shell-contract.sh'
      - 'tests/autolex-theme-reference-dashboard-contract.sh'
      - 'tests/autolex-theme-dynamic-slots-contract.sh'
      - 'tests/autolex-theme-real-media-contract.sh'
      - 'tests/autolex-theme-migration-contract.sh'
      - 'tests/theme-release-contract.sh'
      - 'scripts/release-autolex-theme.sh'
      - 'scripts/prove-autolex-theme-release.sh'
      - 'release/autolex-theme-release-gate.php'
      - '.github/workflows/release-autolex-theme.yml'
      - '.github/workflows/autolex-theme.yml'
  push:
    branches: [main]
    paths:
      - 'theme/autolex-theme/**'
      - 'plugin/autolex-platform/includes/class-autolex-theme-data-bridge.php'
      - 'docs/AUTOLEX-THEME-MIGRATION-AUDIT.md'
      - 'docs/ALX-035-REAL-MEDIA-POLISH.md'
      - 'tests/autolex-theme-contract.sh'
      - 'tests/autolex-theme-hierarchy-contract.sh'
      - 'tests/autolex-theme-vehicle-detail-contract.sh'
      - 'tests/autolex-theme-metadata-contract.sh'
      - 'tests/autolex-theme-assets-contract.sh'
      - 'tests/autolex-theme-images-contract.sh'
      - 'tests/autolex-theme-search-contract.sh'
      - 'tests/autolex-theme-mobile-drawer-contract.sh'
      - 'tests/autolex-theme-home-reference-contract.sh'
      - 'tests/autolex-theme-reference-shell-contract.sh'
      - 'tests/autolex-theme-reference-dashboard-contract.sh'
      - 'tests/autolex-theme-dynamic-slots-contract.sh'
      - 'tests/autolex-theme-real-media-contract.sh'
      - 'tests/autolex-theme-migration-contract.sh'
      - 'tests/theme-release-contract.sh'
      - 'scripts/release-autolex-theme.sh'
      - 'scripts/prove-autolex-theme-release.sh'
      - 'release/autolex-theme-release-gate.php'
      - '.github/workflows/release-autolex-theme.yml'
      - '.github/workflows/autolex-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate light theme foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bash tests/autolex-theme-contract.sh
      - run: bash tests/autolex-theme-hierarchy-contract.sh
      - run: bash tests/autolex-theme-vehicle-detail-contract.sh
      - run: bash tests/autolex-theme-metadata-contract.sh
      - run: bash tests/autolex-theme-assets-contract.sh
      - run: bash tests/autolex-theme-images-contract.sh
      - run: bash tests/autolex-theme-search-contract.sh
      - run: bash tests/autolex-theme-mobile-drawer-contract.sh
      - run: bash tests/autolex-theme-home-reference-contract.sh
      - run: bash tests/autolex-theme-reference-shell-contract.sh
      - run: bash tests/autolex-theme-reference-dashboard-contract.sh
      - run: bash tests/autolex-theme-dynamic-slots-contract.sh
      - run: bash tests/autolex-theme-real-media-contract.sh
      - run: bash tests/autolex-theme-migration-contract.sh
      - run: bash tests/theme-release-contract.sh
