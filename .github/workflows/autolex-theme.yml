name: Autolex Theme Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'theme/autolex-theme/**'
      - 'docs/AUTOLEX-THEME-MIGRATION-AUDIT.md'
      - 'tests/autolex-theme-contract.sh'
      - 'tests/autolex-theme-hierarchy-contract.sh'
      - 'tests/autolex-theme-vehicle-detail-contract.sh'
      - 'tests/autolex-theme-metadata-contract.sh'
      - 'tests/autolex-theme-assets-contract.sh'
      - 'tests/autolex-theme-images-contract.sh'
      - 'tests/autolex-theme-search-contract.sh'
      - 'tests/autolex-theme-migration-contract.sh'
      - '.github/workflows/autolex-theme.yml'
  push:
    branches: [main]
    paths:
      - 'theme/autolex-theme/**'
      - 'docs/AUTOLEX-THEME-MIGRATION-AUDIT.md'
      - 'tests/autolex-theme-contract.sh'
      - 'tests/autolex-theme-hierarchy-contract.sh'
      - 'tests/autolex-theme-vehicle-detail-contract.sh'
      - 'tests/autolex-theme-metadata-contract.sh'
      - 'tests/autolex-theme-assets-contract.sh'
      - 'tests/autolex-theme-images-contract.sh'
      - 'tests/autolex-theme-search-contract.sh'
      - 'tests/autolex-theme-migration-contract.sh'
      - '.github/workflows/autolex-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate light theme foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bash tests/autolex-theme-contract.sh
      - run: bash tests/autolex-theme-hierarchy-contract.sh
      - run: bash tests/autolex-theme-vehicle-detail-contract.sh
      - run: bash tests/autolex-theme-metadata-contract.sh
      - run: bash tests/autolex-theme-assets-contract.sh
      - run: bash tests/autolex-theme-images-contract.sh
      - run: bash tests/autolex-theme-search-contract.sh
      - run: bash tests/autolex-theme-migration-contract.sh
