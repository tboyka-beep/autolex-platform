name: ALX-041 Live Rejection Recovery Verification

on:
  push:
    branches:
      - agent/alx-038-live-data-diagnostic
    paths:
      - '.github/workflows/alx-038-live-data-diagnostic.yml'

permissions:
  contents: read

jobs:
  live-data:
    name: Verify bounded EEA rejection recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Capture recovery baseline
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://autolex.hu/wp-json/autolex/v1/eea-sync-status?diag=${stamp}" -o before-sync.json
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://autolex.hu/wp-json/autolex/v1/eea-failure-summary?diag=${stamp}" -o before-failures.json
          echo '--- baseline sync ---'
          jq '{completed_targets,pending_targets,failed_targets,retry_targets,running_targets,rows_read,vehicles_imported,engine_proposals,link_proposals,last_attempt_at,next_scheduled_at}' before-sync.json
          echo '--- baseline failures ---'
          jq '{failed_targets,categories,target_types,source_years,max_attempts}' before-failures.json

      - name: Drive six native WordPress cron passes
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5 6; do
            echo "=== cron pass ${pass} ==="
            curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
              "https://autolex.hu/wp-cron.php?alx041=${pass}&t=$(date +%s)" >/dev/null
            stamp="$(date +%s)"
            curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "https://autolex.hu/wp-json/autolex/v1/eea-sync-status?alx041=${pass}&diag=${stamp}" \
              | jq -c '{completed_targets,pending_targets,failed_targets,retry_targets,running_targets,rows_read,vehicles_imported,last_attempt_at,next_scheduled_at}'
            if [ "$pass" -lt 6 ]; then
              sleep 35
            fi
          done

      - name: Report recovery result
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://autolex.hu/wp-json/autolex/v1/eea-sync-status?final=${stamp}" -o after-sync.json
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://autolex.hu/wp-json/autolex/v1/eea-failure-summary?final=${stamp}" -o after-failures.json
          echo '--- final sync ---'
          jq '{completed_targets,pending_targets,failed_targets,retry_targets,running_targets,rows_read,vehicles_imported,engine_proposals,link_proposals,last_attempt_at,next_scheduled_at}' after-sync.json
          echo '--- final failures ---'
          jq '{failed_targets,categories,target_types,source_years,max_attempts}' after-failures.json

          before_failed="$(jq -r '.failed_targets // 0' before-sync.json)"
          after_failed="$(jq -r '.failed_targets // 0' after-sync.json)"
          before_imported="$(jq -r '.vehicles_imported // 0' before-sync.json)"
          after_imported="$(jq -r '.vehicles_imported // 0' after-sync.json)"
          echo "failed-delta=$((after_failed - before_failed))"
          echo "imported-delta=$((after_imported - before_imported))"
          test "$after_failed" -le 68
          test "$after_imported" -ge "$before_imported"
