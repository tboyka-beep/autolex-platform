name: ALX-040 Live EEA Failure Triage

on:
  push:
    branches:
      - agent/alx-038-live-data-diagnostic
    paths:
      - '.github/workflows/alx-038-live-data-diagnostic.yml'

permissions:
  contents: read

jobs:
  live-data:
    name: Inspect sanitized live EEA failures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch live failure telemetry
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://autolex.hu/wp-json/autolex/v1/eea-failure-summary?diag=${stamp}" -o failures.json
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://autolex.hu/wp-json/autolex/v1/eea-sync-status?diag=${stamp}" -o sync.json

      - name: Report sanitized failure distribution
        run: |
          set -euo pipefail
          echo '--- EEA failure summary ---'
          jq . failures.json
          echo '--- Current queue summary ---'
          jq '{targets,completed_targets,pending_targets,failed_targets,retry_targets,running_targets,rows_read,vehicles_imported,last_attempt_at,next_scheduled_at}' sync.json
          jq -e '.service == "autolex-eea-failure-telemetry" and .status == "ok" and .privacy == "aggregate_only" and (.failed_targets | type == "number") and (.categories | type == "object")' failures.json >/dev/null
          test "$(jq -r '.failed_targets' failures.json)" -eq "$(jq -r '.failed_targets' sync.json)"
