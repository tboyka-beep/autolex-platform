name: ALX-040 EEA Make Discovery Reproduction

on:
  push:
    branches:
      - agent/alx-038-live-data-diagnostic
    paths:
      - '.github/workflows/alx-038-live-data-diagnostic.yml'

permissions:
  contents: read

jobs:
  live-data:
    name: Reproduce rejected EEA make discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reproduce BMW make-discovery queries at production page size
        run: |
          set -euo pipefail

          run_query() {
            year="$1"
            table="$2"
            status="$3"
            out="eea-${year}.json"
            query="SELECT [Mk] AS [mk], [Cn] AS [cn], [T] AS [t], [Va] AS [va], [Ve] AS [ve], [Ct] AS [ct], [Ft] AS [ft], [Fm] AS [fm], [Ec (cm3)] AS [ec], [Ep (KW)] AS [ep], COUNT(*) AS [r] FROM [CO2Emission].[latest].[${table}] WHERE [Year] = ${year} AND [Status] = '${status}' AND [Mk] = 'BMW' GROUP BY [Mk], [Cn], [T], [Va], [Ve], [Ct], [Ft], [Fm], [Ec (cm3)], [Ep (KW)]"

            curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
              --get \
              --data-urlencode "query=${query}" \
              --data-urlencode 'p=1' \
              --data-urlencode 'nrOfHits=100' \
              https://discodata.eea.europa.eu/sql -o "$out"

            echo "--- ${year} ${table} ---"
            jq -c '{keys:(if type=="object" then keys else ["<array>"] end), error:(.error // .errors // null), result_count:(if (.results? | type)=="array" then (.results|length) else null end), first:(if (.results? | type)=="array" then .results[0] else null end)}' "$out"
          }

          run_query 2022 co2cars_2022Fv26 F
          run_query 2023 co2cars_2023Fv28 F
          run_query 2024 co2cars_2024Pv29 P
          run_query 2025 co2cars_2025Pv31 P
