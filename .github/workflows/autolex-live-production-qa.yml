name: Autolex Live Production QA

on:
  pull_request:
    paths:
      - 'scripts/autolex-live-production-qa.sh'
      - 'scripts/recover-autolex-safety-gate.sh'
      - 'tests/live-production-qa-smoke.sh'
      - 'tests/safety-gate-smoke.php'
      - '.github/workflows/autolex-live-production-qa.yml'
      - 'plugin/autolex-platform/includes/class-autolex-comparison-page.php'
      - 'plugin/autolex-platform/includes/class-autolex-safety-gate.php'
  push:
    branches:
      - main
    paths:
      - 'scripts/autolex-live-production-qa.sh'
      - 'scripts/recover-autolex-safety-gate.sh'
      - 'tests/live-production-qa-smoke.sh'
      - 'tests/safety-gate-smoke.php'
      - '.github/workflows/autolex-live-production-qa.yml'
      - 'plugin/autolex-platform/includes/class-autolex-comparison-page.php'
      - 'plugin/autolex-platform/includes/class-autolex-safety-gate.php'
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected live Autolex plugin version
        required: true
        default: '4.2.0'

permissions:
  contents: read

env:
  AUTOLEX_EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '4.2.0' }}

jobs:
  contract:
    name: Validate live QA contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax and contract markers
        run: bash tests/live-production-qa-smoke.sh

  live-hosted:
    name: Verify production from GitHub-hosted runner
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Recover transient Safety Gate sync state
        run: bash scripts/recover-autolex-safety-gate.sh
      - name: Run fail-closed live production QA
        run: bash scripts/autolex-live-production-qa.sh

  live-home-server:
    name: Verify production from home-server
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: [self-hosted, linux, home-server-autolex]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Recover transient Safety Gate sync state
        run: bash scripts/recover-autolex-safety-gate.sh
      - name: Run fail-closed live production QA
        run: bash scripts/autolex-live-production-qa.sh
