name: Autolex Live Production QA

on:
  pull_request:
    paths:
      - 'scripts/autolex-live-production-qa.sh'
      - 'tests/live-production-qa-smoke.sh'
      - '.github/workflows/autolex-live-production-qa.yml'
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected live Autolex plugin version
        required: true
        default: '4.2.0'

permissions:
  contents: read

jobs:
  contract:
    name: Validate live QA contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax and contract markers
        run: bash tests/live-production-qa-smoke.sh

  live-hosted:
    name: Verify production from GitHub-hosted runner
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run fail-closed live production QA
        env:
          AUTOLEX_EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: bash scripts/autolex-live-production-qa.sh

  live-home-server:
    name: Verify production from home-server
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: [self-hosted, linux, home-server-autolex]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run fail-closed live production QA
        env:
          AUTOLEX_EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: bash scripts/autolex-live-production-qa.sh
