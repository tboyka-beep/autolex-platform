name: Autolex Live Production QA

on:
  pull_request:
    paths:
      - 'scripts/autolex-live-production-qa.sh'
      - 'scripts/autolex-vehicle-media-live-qa.sh'
      - 'scripts/autolex-public-presentation-live-qa.sh'
      - 'scripts/recover-autolex-safety-gate.sh'
      - 'tests/live-production-qa-smoke.sh'
      - 'tests/live-home-server-workflow-contract.sh'
      - 'tests/vehicle-media-live-qa-smoke.sh'
      - 'tests/public-presentation-live-qa-smoke.sh'
      - 'tests/safety-gate-smoke.php'
      - '.github/workflows/autolex-live-production-qa.yml'
      - '.github/workflows/autolex-live-home-server-qa.yml'
      - 'plugin/autolex-platform/**'
  push:
    branches:
      - main
    paths:
      - 'scripts/autolex-live-production-qa.sh'
      - 'scripts/autolex-vehicle-media-live-qa.sh'
      - 'scripts/autolex-public-presentation-live-qa.sh'
      - 'scripts/recover-autolex-safety-gate.sh'
      - 'tests/live-production-qa-smoke.sh'
      - 'tests/live-home-server-workflow-contract.sh'
      - 'tests/vehicle-media-live-qa-smoke.sh'
      - 'tests/public-presentation-live-qa-smoke.sh'
      - 'tests/safety-gate-smoke.php'
      - '.github/workflows/autolex-live-production-qa.yml'
      - '.github/workflows/autolex-live-home-server-qa.yml'
      - 'plugin/autolex-platform/**'
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected live Autolex plugin version
        required: true
        default: '4.2.0'

permissions:
  contents: read

concurrency:
  group: autolex-live-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOLEX_EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '4.2.0' }}

jobs:
  contract:
    name: Validate live QA contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax and contract markers
        run: |
          bash tests/live-production-qa-smoke.sh
          bash tests/live-home-server-workflow-contract.sh
          bash tests/vehicle-media-live-qa-smoke.sh
          bash tests/public-presentation-live-qa-smoke.sh

  live-hosted:
    name: Verify production from GitHub-hosted runner
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Recover transient Safety Gate sync state
        run: bash scripts/recover-autolex-safety-gate.sh
      - name: Run fail-closed live production QA
        run: bash scripts/autolex-live-production-qa.sh
      - name: Prove exact verified vehicle media mappings
        run: bash scripts/autolex-vehicle-media-live-qa.sh
      - name: Prove Hungarian public terminology and factual vehicle content
        run: bash scripts/autolex-public-presentation-live-qa.sh
